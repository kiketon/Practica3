  <form id="pagoForm" class="d-flex flex-column gap-3" style="max-width:400px;margin:auto;">
    <div>
      <label class="form-label">Nombre completo</label>
      <input type="text" class="form-control" required>
    </div>
    <div>
      <label class="form-label">Número de tarjeta</label>
      <input type="text" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-danger w-100">Pagar</button>
  </form>

  <!-- MODAL PAGO REALIZADO -->
<div class="modal" tabindex="-1" id="pagoRealizadoModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Pago realizado</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p>✅ Pago realizado correctamente.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 <script>
  const form = document.getElementById('pagoForm');
  const modalEl = document.getElementById('pagoRealizadoModal');

  // Creamos la instancia del modal de Bootstrap
  const pagoModal = new bootstrap.Modal(modalEl);

  form.addEventListener('submit', function(e) {
    e.preventDefault();          // que no recargue la página
    pagoModal.show();            // 👈 aquí se abre el pop-up
  });

  // (OPCIONAL) ejemplo como el que te han pasado:

</script>
